onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

# Nawigacja między panelami bez prefixu — ctrl+hjkl (jak w starym wezterm/ghostty).
# Splity w ghostty są wyłączone, więc te klawisze docierają do herdr.
# Uwaga: to bindy bezpośrednie (bez prefixu), więc przechwytują ctrl+hjkl w każdym
# panelu — w shellu tracisz ctrl+l (clear) / ctrl+k, a w helix wchodzą do herdr,
# nie do edytora. Jak przeszkadza: użyj "prefix+h" itd. zamiast bezpośrednich.
[keys]
prefix = "ctrl+b"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
# zoom = maksymalizacja panelu. option+m (macos-option-as-alt=left w ghostty).
zoom = "alt+m"
goto = "alt+w"
# Skakanie po workspace'ach w dół/górę — alt+j/k (spójne z hjkl na panelach).
# Bindy bezpośrednie, więc lewy option+j/k nie dociera do shella/helixa (patrz uwaga wyżej).
next_workspace = "alt+j"
previous_workspace = "alt+k"
# Skakanie po agentach (wiersze agentów w sidebarze) — alt+shift+j/k.
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"
# Bezpośredni skok do agenta 1-9 lewym optionem+cyfra.
focus_agent = "alt+1..9"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false
