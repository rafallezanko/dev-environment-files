onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

# Nawigacja między panelami bez prefixu — ctrl+hjkl (jak w starym wezterm/ghostty).
# Splity w ghostty są wyłączone, więc te klawisze docierają do herdr.
# ctrl+hjkl idą przez plugin herdr-splits (patrz [[keys.command]] niżej), który
# w panelu z neovimem przekazuje klawisz DO nvim (nawigacja po splitach), a nvim
# na krawędzi oddaje ruch z powrotem do herdr — jeden zestaw klawiszy na całość.
# W pozostałych panelach działa jak zwykłe focus_pane_* — więc w shellu nadal
# tracisz ctrl+l (clear) / ctrl+k, a helix nie jest wykrywany (klawisze idą do herdr).
[keys]
prefix = "ctrl+b"
# zoom = maksymalizacja panelu. option+m (macos-option-as-alt=left w ghostty).
zoom = "alt+m"
# option+w → fuzzy picker spaces (patrz [[keys.command]] niżej) — flow jak
# workspace switcher w wezterm. Bez bezpośrednich alt+j/k, więc lewy
# option+j/k znów dociera do aplikacji w panelu.
# Wbudowane: goto (panele + spaces) na prefix+g, workspace_picker na prefix+w.
# Skakanie po agentach (wiersze agentów w sidebarze) — alt+shift+j/k.
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"
# Bezpośredni skok do agenta 1-9 lewym optionem+cyfra.
focus_agent = "alt+1..9"
# Navigate mode (goto, alt+w): j/k skacze po spaces w sidebarze.
# Domyślnie j/k ruszały panele — panele w tym trybie przechodzą na strzałki
# (strzałki działają tam zawsze), h/l zostają na panelach lewo/prawo.
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

# ctrl+hjkl → plugin herdr-splits (per-maszyna: `herdr plugin install
# lmilojevicc/herdr-splits.nvim`): nvim w panelu = klawisz idzie do nvim,
# inaczej = zwykła zmiana panelu. Nvim-side to plugins/herdr-splits.lua.
# Resize (alt+hjkl z README pluginu) pominięty — alt+j/k zajęte przez workspace'y.
# alt+w → własny fuzzy picker spaces (fzf, `brew install fzf`): worktree
# zgrupowane per repo jak w sidebarze, pisanie filtruje, ctrl+j/k po liście.
[[keys.command]]
key = "alt+w"
type = "popup"
command = "~/.config/herdr/scripts/herdr-space-picker.sh"
description = "fuzzy switch spaces"
width = "50%"
height = "60%"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false
